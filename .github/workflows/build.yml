name: Build GNU-Upscaler

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - 'README.md'
      - 'install.sh'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 50

      - name: Cache MSBuild Intermediate Files
        id: msbuild-cache
        uses: actions/cache@v4
        with:
          path: |
            OptiScaler/OptiScaler/x64/Release
            OptiPatcher/OptiPatcher/x64/Release
          key: msbuild-x64-release-${{ hashFiles('**/*.vcxproj', '**/*.sln') }}-${{ github.sha }}
          restore-keys: |
            msbuild-x64-release-${{ hashFiles('**/*.vcxproj', '**/*.sln') }}-

      - name: Sync Source Timestamps for Incremental MSBuild
        shell: pwsh
        run: |
          $intDirs = @("OptiScaler/OptiScaler/x64/Release", "OptiPatcher/OptiPatcher/x64/Release")
          $shaFile = "OptiScaler/OptiScaler/x64/Release/.cached_sha"
          $cachedSha = if (Test-Path $shaFile) { (Get-Content $shaFile -Raw).Trim() } else { "" }
          $hasValidBase = $false
          if ($cachedSha -match '^[0-9a-f]{40}$') {
              git cat-file -e "${cachedSha}^{commit}" 2>$null
              $hasValidBase = ($LASTEXITCODE -eq 0)
          }

          if (-not $hasValidBase) {
              Write-Host "No usable incremental cache base found; performing clean build."
              foreach ($dir in $intDirs) {
                  if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
              }
              exit 0
          }

          $now = [DateTime]::UtcNow
          $oldSourceTime = $now.AddHours(-2)
          $pchTime = $now.AddMinutes(-90)
          $objTime = $now.AddMinutes(-60)

          # Set baseline timestamps: unchanged sources < PCH < OBJs/tlogs
          foreach ($root in @("OptiScaler", "OptiPatcher")) {
              if (Test-Path $root) {
                  Get-ChildItem -Path $root -Recurse -File | ForEach-Object {
                      if ($_.FullName -notmatch '\\x64\\Release\\') {
                          $_.LastWriteTimeUtc = $oldSourceTime
                      }
                  }
              }
          }
          foreach ($dir in $intDirs) {
              if (Test-Path $dir) {
                  Get-ChildItem -Path $dir -Recurse -File | ForEach-Object {
                      if ($_.Extension -in @('.pch', '.ipch', '.idb')) {
                          $_.LastWriteTimeUtc = $pchTime
                      } else {
                          $_.LastWriteTimeUtc = $objTime
                      }
                  }
              }
          }

          # Touch files changed since the cached commit so MSBuild recompiles them and dependents
          $changed = git diff --name-only "$cachedSha" HEAD
          Write-Host "Cached base: $cachedSha -> HEAD ($($env:GITHUB_SHA))"
          foreach ($rel in $changed) {
              if (-not $rel) { continue }
              Write-Host "Changed: $rel"
              if (Test-Path -LiteralPath $rel -PathType Container) {
                  # Submodule pointer updated: touch all files inside that submodule
                  Get-ChildItem -LiteralPath $rel -Recurse -File | ForEach-Object {
                      $_.LastWriteTimeUtc = $now
                  }
              } elseif (Test-Path -LiteralPath $rel -PathType Leaf) {
                  (Get-Item -LiteralPath $rel).LastWriteTimeUtc = $now
              }
          }

      - name: Add 7-Zip to PATH
        shell: pwsh
        run: |
          "C:\Program Files\7-Zip" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Cache Intel XeSS Runtime DLLs
        uses: actions/cache@v4
        with:
          path: OptiScaler/external/xess/bin
          key: xess-sdk-bin-v3.0.2-v1

      - name: Fetch Intel XeSS Runtime DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $binDir = "OptiScaler\external\xess\bin"
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null

          $xessDlls = [ordered]@{
              "libxess_fg.dll"   = "ec5e0c65e075570c6ede72618bb666d0be0c2e10b2ea9762c0fe8cb8e375ab27"
              "libxell.dll"      = "d2030dcd694fda8f2ec7e044b13e6db8f0b56d4ba9113a5efad334e3f3ded8c7"
              "libxess.dll"      = "251659dd84a3e84de67c886a4186e01f3eca49b00641906fe38bb6b807e5d5b7"
              "libxess_dx11.dll" = "c7cfe86f0c9d94e4fb3696d3cd5035e2bbb6a8b1b0572f8b7395a4cdfd0c625e"
          }

          foreach ($entry in $xessDlls.GetEnumerator()) {
              $dllName = $entry.Key
              $expectedHash = $entry.Value.ToUpperInvariant()
              $dst = Join-Path $binDir $dllName

              if (Test-Path $dst) {
                  $actualHash = (Get-FileHash -Path $dst -Algorithm SHA256).Hash.ToUpperInvariant()
                  if ($actualHash -eq $expectedHash) {
                      Write-Host "$dllName verified from cache ($actualHash)"
                      continue
                  }
                  Write-Warning "$dllName hash mismatch ($actualHash != $expectedHash); re-downloading"
                  Remove-Item -Path $dst -Force
              }

              $url = "https://raw.githubusercontent.com/intel/xess/v3.0.2/bin/$dllName"
              Write-Host "Downloading $dllName from $url..."
              Invoke-WebRequest -Uri $url -OutFile $dst -UseBasicParsing

              $actualHash = (Get-FileHash -Path $dst -Algorithm SHA256).Hash.ToUpperInvariant()
              if ($actualHash -ne $expectedHash) {
                  Remove-Item -Path $dst -Force -ErrorAction SilentlyContinue
                  throw "$dllName SHA-256 verification failed: expected $expectedHash, got $actualHash"
              }
              Write-Host "$dllName downloaded and verified ($actualHash)"
          }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build GNU-Upscaler (OptiScaler)
        working-directory: OptiScaler
        shell: cmd
        run: |
          msbuild /m /p:Configuration=Release /p:Platform=x64 OptiScaler.sln /verbosity:minimal

      - name: Build OptiPatcher
        working-directory: OptiPatcher
        shell: cmd
        run: |
          msbuild /m /p:Configuration=Release /p:Platform=x64 OptiPatcher.sln /verbosity:minimal

      - name: Record Cached Commit SHA
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "OptiScaler/OptiScaler/x64/Release" | Out-Null
          $env:GITHUB_SHA | Set-Content -Path "OptiScaler/OptiScaler/x64/Release/.cached_sha" -NoNewline -Encoding ASCII

      - name: Prepare Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ".\dist"
          New-Item -ItemType Directory -Force -Path ".\dist\plugins"
          
          # Check common output locations
          $dll = Get-ChildItem -Path ".\OptiScaler" -Recurse -Filter "OptiScaler.dll" | Where-Object { $_.FullName -match "Release" } | Select-Object -First 1
          if (-not $dll) {
              Write-Error "Could not find compiled OptiScaler.dll in Release output!"
              exit 1
          }
          Write-Host "Found compiled DLL: $($dll.FullName)"
          Copy-Item -Path $dll.FullName -Destination ".\dist\OptiScaler.dll" -Force
          Copy-Item -Path ".\OptiScaler\OptiScaler.ini" -Destination ".\dist\OptiScaler.ini" -Force

          # Copy OptiPatcher plugin
          $patcher = Get-ChildItem -Path ".\OptiPatcher" -Recurse -Filter "OptiPatcher.asi" | Where-Object { $_.FullName -match "Release" } | Select-Object -First 1
          if ($patcher) {
              Write-Host "Found compiled OptiPatcher: $($patcher.FullName)"
              Copy-Item -Path $patcher.FullName -Destination ".\dist\plugins\OptiPatcher.asi" -Force
          } else {
              Write-Warning "OptiPatcher.asi not found in build output!"
          }

          # Copy OptiScaler backend directory if produced by post-build
          $backendDir = Get-ChildItem -Path ".\OptiScaler" -Recurse -Directory -Filter "OptiScaler" | Where-Object { $_.FullName -match "Release" } | Select-Object -First 1
          if ($backendDir) {
              Copy-Item -Path $backendDir.FullName -Destination ".\dist\OptiScaler" -Recurse -Force
          }

          # Copy XeSS / XeFG / XeLL runtime DLLs
          foreach ($xessDll in @("libxess_fg.dll", "libxell.dll", "libxess.dll", "libxess_dx11.dll")) {
              $src = ".\OptiScaler\external\xess\bin\$xessDll"
              if (Test-Path $src) {
                  Copy-Item -Path $src -Destination ".\dist\$xessDll" -Force
              } else {
                  throw "Required Intel XeSS runtime DLL not found at $src"
              }
          }
          
          # Create zip bundle
          Compress-Archive -Path ".\dist\*" -DestinationPath ".\dist\GNU-Upscaler-latest.zip" -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GNU-Upscaler-Release
          path: .\dist\*
          if-no-files-found: error

      - name: Release Latest Build
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: latest
          name: "GNU-Upscaler (Latest Automated Build)"
          body: "Automated build of GNU-Upscaler compiled with MSVC on GitHub Actions."
          files: |
            .\dist\OptiScaler.dll
            .\dist\OptiScaler.ini
            .\dist\GNU-Upscaler-latest.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
