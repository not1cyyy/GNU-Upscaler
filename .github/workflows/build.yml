name: Build GNU-Upscaler

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - 'README.md'
      - 'install.sh'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Add 7-Zip to PATH
        shell: pwsh
        run: |
          "C:\Program Files\7-Zip" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build GNU-Upscaler (OptiScaler)
        working-directory: OptiScaler
        shell: cmd
        run: |
          msbuild /m /p:Configuration=Release /p:Platform=x64 OptiScaler.sln /verbosity:minimal

      - name: Build OptiPatcher
        working-directory: OptiPatcher
        shell: cmd
        run: |
          msbuild /m /p:Configuration=Release /p:Platform=x64 OptiPatcher.sln /verbosity:minimal

      - name: Prepare Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ".\dist"
          New-Item -ItemType Directory -Force -Path ".\dist\plugins"
          
          # Check common output locations
          $dll = Get-ChildItem -Path ".\OptiScaler" -Recurse -Filter "OptiScaler.dll" | Where-Object { $_.FullName -match "Release" } | Select-Object -First 1
          if (-not $dll) {
              Write-Error "Could not find compiled OptiScaler.dll in Release output!"
              exit 1
          }
          Write-Host "Found compiled DLL: $($dll.FullName)"
          Copy-Item -Path $dll.FullName -Destination ".\dist\OptiScaler.dll" -Force
          Copy-Item -Path ".\OptiScaler\OptiScaler.ini" -Destination ".\dist\OptiScaler.ini" -Force

          # Copy OptiPatcher plugin
          $patcher = Get-ChildItem -Path ".\OptiPatcher" -Recurse -Filter "OptiPatcher.asi" | Where-Object { $_.FullName -match "Release" } | Select-Object -First 1
          if ($patcher) {
              Write-Host "Found compiled OptiPatcher: $($patcher.FullName)"
              Copy-Item -Path $patcher.FullName -Destination ".\dist\plugins\OptiPatcher.asi" -Force
          } else {
              Write-Warning "OptiPatcher.asi not found in build output!"
          }

          # Copy OptiScaler backend directory if produced by post-build
          $backendDir = Get-ChildItem -Path ".\OptiScaler" -Recurse -Directory -Filter "OptiScaler" | Where-Object { $_.FullName -match "Release" } | Select-Object -First 1
          if ($backendDir) {
              Copy-Item -Path $backendDir.FullName -Destination ".\dist\OptiScaler" -Recurse -Force
          }

          # Fetch all FSR4 custom provider variants (INT8 & FP8) from Optiscaler-Client repos
          $headers = @{
              "User-Agent" = "gnu-upscaler-ci"
              "Authorization" = "Bearer ${{ secrets.GITHUB_TOKEN }}"
          }
          $extraRepos = @(
              @{ Repo = "Optiscaler-Client/OptiScaler-Extras"; Suffix = "INT8" },
              @{ Repo = "Optiscaler-Client/OptiScaler-Extras-FP8"; Suffix = "FP8" }
          )
          New-Item -ItemType Directory -Force -Path ".\dist\custom" | Out-Null
          New-Item -ItemType Directory -Force -Path ".\tmp_extras" | Out-Null

          foreach ($entry in $extraRepos) {
              $apiUrl = "https://api.github.com/repos/$($entry.Repo)/releases?per_page=20"
              try {
                  $releases = Invoke-RestMethod -Uri $apiUrl -Headers $headers -TimeoutSec 30
                  foreach ($rel in $releases) {
                      $tag = $rel.tag_name -replace '[^a-zA-Z0-9._-]', '_'
                      $asset = $rel.assets | Where-Object { $_.name -match '\.(zip|7z)$' } | Select-Object -First 1
                      if (-not $asset) { continue }

                      $variantName = "${tag}_$($entry.Suffix)"
                      $targetDir = ".\dist\custom\$variantName\ffx"
                      $extractDir = ".\tmp_extras\$variantName"
                      $archivePath = ".\tmp_extras\$($asset.name)"

                      Write-Host "Fetching $($entry.Repo) -> $variantName ($($asset.name))"
                      Invoke-WebRequest -Uri $asset.browser_download_url -Headers $headers -OutFile $archivePath -TimeoutSec 120
                      New-Item -ItemType Directory -Force -Path $extractDir | Out-Null
                      & 7z x -y "-o$extractDir" $archivePath | Out-Null

                      $dlls = Get-ChildItem -Path $extractDir -Recurse -Filter "*.dll"
                      if ($dlls) {
                          New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
                          foreach ($d in $dlls) {
                              Copy-Item -Path $d.FullName -Destination $targetDir -Force
                          }
                      }
                  }
              } catch {
                  Write-Warning "Failed to fetch extras from $($entry.Repo): $_"
              }
          }
          Remove-Item -Path ".\tmp_extras" -Recurse -Force -ErrorAction SilentlyContinue
          
          # Create zip bundle
          Compress-Archive -Path ".\dist\*" -DestinationPath ".\dist\GNU-Upscaler-latest.zip" -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GNU-Upscaler-Release
          path: .\dist\*
          if-no-files-found: error

      - name: Release Latest Build
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: latest
          name: "GNU-Upscaler (Latest Automated Build)"
          body: "Automated build of GNU-Upscaler compiled with MSVC on GitHub Actions."
          files: |
            .\dist\OptiScaler.dll
            .\dist\OptiScaler.ini
            .\dist\GNU-Upscaler-latest.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
