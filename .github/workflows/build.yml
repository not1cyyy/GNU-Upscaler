name: Build GNU-Upscaler

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add 7-Zip to PATH
        shell: pwsh
        run: |
          "C:\Program Files\7-Zip" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Fetch External SDKs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "OptiScaler\external"
          Set-Location "OptiScaler\external"

          Write-Host "Fetching external SDK dependencies..."
          if (-not (Test-Path "simpleini\SimpleIni.h")) {
              git clone --depth 1 https://github.com/brofield/simpleini simpleini
          }
          if (-not (Test-Path "unordered_dense\include")) {
              git clone --depth 1 https://github.com/martinus/unordered_dense.git unordered_dense
          }
          if (-not (Test-Path "vulkan\include")) {
              git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers.git vulkan
          }
          if (-not (Test-Path "spdlog\include")) {
              git clone --depth 1 https://github.com/gabime/spdlog.git spdlog
          }
          if (-not (Test-Path "magic_enum\include")) {
              git clone --depth 1 https://github.com/Neargye/magic_enum magic_enum
          }
          if (-not (Test-Path "nvapi\nvapi.h")) {
              git clone --depth 1 https://github.com/NVIDIA/nvapi.git nvapi
          }
          if (-not (Test-Path "xess\inc")) {
              git clone --depth 1 https://github.com/intel/xess.git xess
          }
          if (-not (Test-Path "FidelityFX-SDK\ffx-api")) {
              git clone --depth 1 https://github.com/GPUOpen-LibrariesAndSDKs/FidelityFX-SDK FidelityFX-SDK
          }
          if (-not (Test-Path "FidelityFX-SDK-v2\Kits")) {
              git clone --depth 1 -b v2.4.0 https://github.com/GPUOpen-LibrariesAndSDKs/FidelityFX-SDK.git FidelityFX-SDK-v2
          }
          Write-Host "External SDKs ready."

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build GNU-Upscaler (OptiScaler)
        working-directory: OptiScaler
        shell: cmd
        run: |
          msbuild /m /p:Configuration=Release /p:Platform=x64 OptiScaler.sln /verbosity:minimal

      - name: Prepare Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ".\dist"
          
          # Check common output locations
          $dll = Get-ChildItem -Path ".\OptiScaler" -Recurse -Filter "OptiScaler.dll" | Where-Object { $_.FullName -match "Release" } | Select-Object -First 1
          if (-not $dll) {
              Write-Error "Could not find compiled OptiScaler.dll in Release output!"
              exit 1
          }
          Write-Host "Found compiled DLL: $($dll.FullName)"
          Copy-Item -Path $dll.FullName -Destination ".\dist\OptiScaler.dll" -Force
          Copy-Item -Path ".\OptiScaler\OptiScaler.ini" -Destination ".\dist\OptiScaler.ini" -Force

          # Copy OptiScaler backend directory if produced by post-build
          $backendDir = Get-ChildItem -Path ".\OptiScaler" -Recurse -Directory -Filter "OptiScaler" | Where-Object { $_.FullName -match "Release" } | Select-Object -First 1
          if ($backendDir) {
              Copy-Item -Path $backendDir.FullName -Destination ".\dist\OptiScaler" -Recurse -Force
          }
          
          # Create zip bundle
          Compress-Archive -Path ".\dist\*" -DestinationPath ".\dist\GNU-Upscaler-latest.zip" -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GNU-Upscaler-Release
          path: .\dist\*
          if-no-files-found: error

      - name: Release Latest Build
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: latest
          name: "GNU-Upscaler (Latest Automated Build)"
          body: "Automated build of GNU-Upscaler compiled with MSVC on GitHub Actions."
          files: |
            .\dist\OptiScaler.dll
            .\dist\OptiScaler.ini
            .\dist\GNU-Upscaler-latest.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
